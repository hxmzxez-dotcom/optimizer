name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Zip'i ac
        run: |
          unzip -oq optimizer-mod.zip
          ls optimizer

      - name: Guncel surumleri bul
        working-directory: optimizer
        run: |
          MC=1.21.11
          YARN=$(curl -s https://meta.fabricmc.net/v2/versions/yarn/$MC | jq -r '.[0].version')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable==true)][0].version')
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
            | grep -o "<version>[^<]*+$MC</version>" | sed 's/<[^>]*>//g' | tail -1)
          echo "yarn=$YARN loader=$LOADER api=$API"
          sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|" gradle.properties
          sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties
          sed -i "s|^fabric_version=.*|fabric_version=$API|" gradle.properties
          cat gradle.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Derle
        working-directory: optimizer
        run: gradle build --no-daemon

      - name: Release olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: optimizer/build/libs/optimizer-1.0.0.jar
